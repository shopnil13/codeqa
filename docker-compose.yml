services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: codeqa
      POSTGRES_PASSWORD: codeqa
      POSTGRES_DB: codeqa
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant:v1.11.0   # pin the exact tag you test with
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
volumes:
  pgdata:
  qdrantdata: