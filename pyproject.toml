[project]
name = "codeqa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shopnil13", email = "rifat.shopnil13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
codeqa = "codeqa:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
